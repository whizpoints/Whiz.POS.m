<!DOCTYPE html><html><head><title>Upload EXE</title></head><body><h2>Upload EXE to R2</h2><form id="form"><input type="file" id="file" name="file" accept=".exe" required /><button type="submit">Upload</button></form><p id="result"></p><script>document.getElementById("form").onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(); formData.append("file", document.getElementById("file").files[0]); document.getElementById("result").innerText = "Uploading..."; const res = await fetch("http://localhost:3000/api/downloads/upload", { method: "POST", body: formData }); const data = await res.json(); document.getElementById("result").innerHTML = data.success ? "Success! Share Link: <a href=\"" + data.shareLink + "\">" + data.shareLink + "</a>" : "Error: " + data.error; };</script></body></html>
